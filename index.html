<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102b4e">
  <title>Human Test Center | Sistema de Actividades</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --navy: #102b4e;
      --blue: #1768ac;
      --blue-light: #eaf3ff;
      --bg: #f3f6fb;
      --white: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --border: #dbe3ed;
      --green: #15803d;
      --red: #b91c1c;
      --radius: 16px;
      --shadow: 0 8px 28px rgba(15, 40, 75, .08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
    }

    header {
      position: relative;
      overflow: hidden;
      padding: 28px 20px;
      color: white;
      text-align: center;
      background: linear-gradient(135deg, #102b4e, #1768ac);
      box-shadow: 0 5px 20px rgba(16, 43, 78, .15);
    }

    header:after {
      content: "";
      position: absolute;
      width: 250px;
      height: 250px;
      border: 35px solid rgba(255,255,255,.06);
      border-radius: 50%;
      right: -80px;
      top: -125px;
      pointer-events: none;
    }

    .brand-logo {
      display: block;
      width: auto;
      max-width: 115px;
      max-height: 85px;
      object-fit: contain;
      margin: 0 auto 12px;
      border-radius: 10px;
      background: white;
      padding: 5px;
    }

    header h1 {
      margin: 0 0 6px;
      font-size: clamp(1.5rem, 4vw, 2.2rem);
      letter-spacing: .2px;
    }

    header p {
      margin: 0;
      color: #e0edff;
    }

    main {
      max-width: 1180px;
      margin: 28px auto;
      padding: 0 20px 30px;
    }

    .panel {
      background: var(--white);
      padding: 25px;
      margin-bottom: 22px;
      border: 1px solid rgba(219, 227, 237, .9);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    h2 {
      margin: 0 0 12px;
      color: var(--navy);
      font-size: 1.35rem;
    }

    h3 {
      margin-top: 25px;
      color: var(--navy);
    }

    .muted {
      color: var(--muted);
      font-size: .92rem;
    }

    label {
      display: block;
      font-weight: 650;
      margin: 14px 0 6px;
      font-size: .94rem;
    }

    input, select, textarea {
      display: block;
      width: 100%;
      padding: 12px 13px;
      color: var(--text);
      background: white;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      font: inherit;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(23, 104, 172, .12);
    }

    input:disabled, select:disabled {
      background: #f1f5f9;
      color: #475569;
      cursor: not-allowed;
    }

    textarea {
      min-height: 95px;
      resize: vertical;
    }

    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 42px;
      padding: 10px 16px;
      margin: 12px 8px 0 0;
      border: 0;
      border-radius: 9px;
      cursor: pointer;
      font: inherit;
      font-weight: 650;
      transition: transform .15s, filter .15s, box-shadow .15s;
    }

    button:hover:not(:disabled) {
      filter: brightness(.96);
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
      transform: none;
    }

    .primary {
      color: white;
      background: var(--blue);
      box-shadow: 0 3px 8px rgba(23,104,172,.15);
    }

    .secondary {
      color: #26364b;
      background: #e8eef6;
    }

    .logout, .danger {
      color: white;
      background: var(--red);
    }

    .hidden, [hidden] {
      display: none !important;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0 20px;
    }

    .full {
      grid-column: 1 / -1;
    }

    #loginPanel {
      max-width: 510px;
      margin: 45px auto;
      padding: 32px;
    }

    #loginPanel h2 {
      font-size: 1.65rem;
    }
