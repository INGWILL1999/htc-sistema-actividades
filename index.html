
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Human Test Center | Actividades</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      margin: 0;
      color: #1e293b;
    }

    header {
      background: #12345a;
      color: white;
      padding: 24px;
      text-align: center;
    }

    main {
      box-sizing: border-box;
      max-width: 430px;
      margin: 35px auto;
      padding: 24px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 18px #00000012;
    }

    label {
      display: block;
      margin-top: 16px;
      font-weight: bold;
    }

    input {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin-top: 7px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
    }

    button {
      padding: 12px;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 14px;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }

    .principal {
      width: 100%;
      color: white;
      background: #1768ac;
    }

    .secundario {
      width: 100%;
      background: #e2e8f0;
    }

    #mensaje {
      margin-top: 18px;
      overflow-wrap: anywhere;
    }

    .nota {
      color: #64748b;
      font-size: 13px;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <header>
    <h1>Human Test Center</h1>
    <p>Sistema de Registro de Actividades</p>
  </header>

  <main>
    <h2>Iniciar sesión</h2>
    <p>Accede con tu cuenta de empleado.</p>

    <form id="loginForm">
      <label for="email">Correo electrónico</label>
      <input
        id="email"
        name="email"
        type="email"
        required
        autocomplete="username"
      >

      <label for="password">Contraseña</label>
      <input
        id="password"
        name="password"
        type="password"
        required
        autocomplete="current-password"
      >

      <button class="principal" id="loginBtn" type="submit">
        Iniciar sesión
      </button>
    </form>

    <button
      class="secundario"
      id="cerrarSesion"
      type="button"
      hidden
    >
      Cerrar sesión
    </button>

    <p id="mensaje" role="status" aria-live="polite">
      Preparando conexión...
    </p>

    <p class="nota">
      El acceso depende de la configuración de autenticación
      y de los permisos de Supabase.
    </p>
  </main>

  <script>
    const SUPABASE_URL =
      "https://qzsyejizsjgubitzrdsj.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_b_aQlGzfTH_nitP5T5OwZg_zPwBPW-i";

    const db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const mensaje = document.getElementById("mensaje");
    const formulario = document.getElementById("loginForm");
    const botonLogin = document.getElementById("loginBtn");
    const botonCerrar = document.getElementById("cerrarSesion");

    function mostrarMensaje(texto) {
      mensaje.textContent = texto;
    }

    async function actualizarSesion() {
      const { data, error } = await db.auth.getSession();

      if (error) {
        mostrarMensaje("No se pudo consultar la sesión.");
        return;
      }

      if (data.session) {
        formulario.hidden = true;
        botonCerrar.hidden = false;

        mostrarMensaje(
          "Sesión iniciada: " +
          data.session.user.email +
          ". La conexión con Supabase funciona."
        );
      } else {
        formulario.hidden = false;
        botonCerrar.hidden = true;

        mostrarMensaje(
          "Conexión inicializada. Inicia sesión para continuar."
        );
      }
    }

    formulario.addEventListener("submit", async (event) => {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      botonLogin.disabled = true;
      mostrarMensaje("Verificando credenciales...");

      try {
        const { error } = await db.auth.signInWithPassword({
          email,
          password
        });

        if (error) {
          mostrarMensaje(
            "No se pudo iniciar sesión. Comprueba tu correo y contraseña."
          );
          return;
        }

        await actualizarSesion();
      } catch (error) {
        mostrarMensaje(
          "No se pudo conectar con el servicio de autenticación."
        );
      } finally {
        botonLogin.disabled = false;
      }
    });

    botonCerrar.addEventListener("click", async () => {
      botonCerrar.disabled = true;
      mostrarMensaje("Cerrando sesión...");

      try {
        const { error } = await db.auth.signOut();

        if (error) {
          mostrarMensaje("No se pudo cerrar la sesión.");
          return;
        }

        await actualizarSesion();
      } catch (error) {
        mostrarMensaje("Ocurrió un error al cerrar la sesión.");
      } finally {
        botonCerrar.disabled = false;
      }
    });

    db.auth.onAuthStateChange((event, session) => {
      if (event === "SIGNED_IN" || event === "SIGNED_OUT") {
        actualizarSesion();
      }
    });

    actualizarSesion();
  </script>
</body>
</html>
