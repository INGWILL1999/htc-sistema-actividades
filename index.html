
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Human Test Center | Actividades</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f1f5f9;
      color: #1e293b;
    }
    header {
      background: #12345a;
      color: white;
      padding: 22px;
      text-align: center;
    }
    main {
      max-width: 950px;
      margin: 25px auto;
      padding: 20px;
    }
    .panel {
      background: white;
      padding: 22px;
      margin-bottom: 20px;
      border-radius: 12px;
      box-shadow: 0 3px 12px #00000010;
    }
    label {
      display: block;
      font-weight: bold;
      margin: 14px 0 6px;
    }
    input, select, textarea {
      width: 100%;
      padding: 11px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font: inherit;
    }
    textarea { min-height: 90px; resize: vertical; }
    button {
      border: 0;
      border-radius: 6px;
      padding: 12px 16px;
      margin-top: 14px;
      cursor: pointer;
      font-weight: bold;
    }
    button:disabled { opacity: .6; cursor: wait; }
    .primary { background: #1768ac; color: white; }
    .secondary { background: #e2e8f0; color: #1e293b; }
    .logout { background: #b91c1c; color: white; }
    .hidden { display: none !important; }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0 18px;
    }
    .full { grid-column: 1 / -1; }
    .activity {
      border: 1px solid #dbe3ed;
      border-radius: 8px;
      padding: 14px;
      margin-top: 12px;
      overflow-wrap: anywhere;
    }
    .muted { color: #64748b; font-size: 14px; }
    #mensaje { overflow-wrap: anywhere; }
    @media (max-width: 600px) {
      main { padding: 12px; }
      .grid { grid-template-columns: 1fr; }
      .full { grid-column: auto; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Human Test Center</h1>
    <p>Sistema de Registro de Actividades</p>
  </header>

  <main>
    <section id="loginPanel" class="panel">
      <h2>Iniciar sesión</h2>
      <form id="loginForm">
        <label for="email">Correo electrónico</label>
        <input id="email" type="email" autocomplete="username" required>

        <label for="password">Contraseña</label>
        <input id="password" type="password"
          autocomplete="current-password" required>

        <button class="primary" id="loginBtn" type="submit">
          Iniciar sesión
        </button>
      </form>
    </section>

    <section id="appPanel" class="hidden">
      <div class="panel">
        <div id="usuarioInfo"></div>
        <button id="logoutBtn" class="logout" type="button">
          Cerrar sesión
        </button>
      </div>

      <div class="panel">
        <h2>Registrar actividad</h2>
        <form id="activityForm">
          <div class="grid">
            <div class="full">
              <label for="department">Departamento</label>
              <select id="department" required></select>
            </div>

            <div>
              <label for="activityDate">Fecha</label>
              <input id="activityDate" type="date" required>
            </div>

            <div>
              <label for="activityTime">Hora (opcional)</label>
              <input id="activityTime" type="time">
            </div>

            <div class="full">
              <label for="title">Título de la actividad</label>
              <input id="title" type="text" maxlength="200" required>
            </div>

            <div class="full">
              <label for="description">Descripción del trabajo realizado</label>
              <textarea id="description" required></textarea>
            </div>

            <div>
              <label for="deadline">¿Se cumplió el plazo?</label>
              <select id="deadline">
                <option value="">Sin indicar</option>
                <option value="true">Sí</option>
                <option value="false">No</option>
              </select>
            </div>

            <div>
              <label for="status">Estado</label>
              <select id="status" required>
                <option value="Pendiente">Pendiente</option>
                <option value="En proceso">En proceso</option>
                <option value="Completada">Completada</option>
              </select>
            </div>

            <div class="full">
              <label for="observations">Observaciones</label>
              <textarea id="observations"></textarea>
            </div>
          </div>

          <button id="saveBtn" class="primary" type="submit">
            Guardar actividad
          </button>
        </form>
        <p id="formMessage" role="status" aria-live="polite"></p>
      </div>

      <div class="panel">
        <h2>Actividades de esta semana</h2>
        <p id="weekLabel" class="muted"></p>
        <button id="refreshBtn" class="secondary" type="button">
          Actualizar lista
        </button>
        <div id="activityList"></div>
      </div>
    </section>

    <p id="mensaje" role="status" aria-live="polite"></p>
  </main>

  <script>
    const SUPABASE_URL =
      "https://qzsyejizsjgubitzrdsj.supabase.co";
    const SUPABASE_KEY =
      "sb_publishable_b_aQlGzfTH_nitP5T5OwZg_zPwBPW-i";

    const db = window.supabase.createClient(
      SUPABASE_URL, SUPABASE_KEY
    );

    const $ = id => document.getElementById(id);
    let currentUser = null;
    let profile = null;
    let departments = [];

    function localDate(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }

    function weekRange() {
      const today = new Date();
      const monday = new Date(today);
      const day = (today.getDay() + 6) % 7;
      monday.setDate(today.getDate() - day);
      monday.setHours(0, 0, 0, 0);

      const sunday = new Date(monday);
      sunday.setDate(monday.getDate() + 6);

      return [localDate(monday), localDate(sunday)];
    }

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    function showMessage(text) {
      $("mensaje").textContent = text;
    }

    function showFormMessage(text) {
      $("formMessage").textContent = text;
    }

    function showLoggedOut() {
      currentUser = null;
      profile = null;
      $("loginPanel").classList.remove("hidden");
      $("appPanel").classList.add("hidden");
    }

    async function loadDashboard() {
      const { data: sessionData, error: sessionError } =
        await db.auth.getSession();

      if (sessionError || !sessionData.session) {
        showLoggedOut();
        return;
      }

      currentUser = sessionData.session.user;

      const { data: userProfile, error: profileError } = await db
        .from("profiles")
        .select("id, full_name, department_id, role, active")
        .eq("id", currentUser.id)
        .maybeSingle();

      if (profileError || !userProfile || !userProfile.active) {
        showLoggedOut();
        showMessage(
          "No se pudo validar tu perfil. Contacta al administrador."
        );
        return;
      }

      profile = userProfile;

      const { data: deptData, error: deptError } = await db
        .from("departments")
        .select("id, name")
        .order("id");

      if (deptError || !deptData) {
        showMessage("No se pudieron cargar los departamentos.");
        return;
      }

      departments = deptData;

      $("loginPanel").classList.add("hidden");
      $("appPanel").classList.remove("hidden");

      $("usuarioInfo").textContent =
        `Usuario: ${profile.full_name} (${currentUser.email}) · ` +
        `Rol: ${profile.role}`;

      const departmentSelect = $("department");
      departmentSelect.replaceChildren();

      const allowedDepartments = profile.role === "admin"
        ? departments
        : departments.filter(
            d => String(d.id) === String(profile.department_id)
          );

      allowedDepartments.forEach(dept => {
        const option = document.createElement("option");
        option.value = dept.id;
        option.textContent = dept.name;
        departmentSelect.appendChild(option);
      });

      if (allowedDepartments.length === 0) {
        showMessage("Tu perfil no tiene un departamento asignado.");
        return;
      }

      departmentSelect.disabled = profile.role !== "admin";
      $("activityDate").value = localDate(new Date());

      showMessage("");
      await loadActivities();
    }

    async function loadActivities() {
      const [startDate, endDate] = weekRange();
      $("weekLabel").textContent = `${startDate} al ${endDate}`;
      $("activityList").textContent = "Cargando actividades...";

      const { data, error } = await db
        .from("activities")
        .select("id, department_id, title, activity_date, activity_time, description, deadline_met, observations, status")
        .gte("activity_date", startDate)
        .lte("activity_date", endDate)
        .order("activity_date", { ascending: false })
        .order("activity_time", { ascending: false });

      if (error) {
        $("activityList").textContent =
          "No se pudieron cargar las actividades. Verifica los permisos.";
        return;
      }

      if (!data || data.length === 0) {
        $("activityList").textContent =
          "Todavía no hay actividades registradas esta semana.";
        return;
      }

      $("activityList").innerHTML = data.map(activity => {
        const dept = departments.find(
          d => String(d.id) === String(activity.department_id)
        );
        const deadline = activity.deadline_met === null
          ? "Sin indicar"
          : activity.deadline_met ? "Sí" : "No";

        return `
          <article class="activity">
            <strong>${escapeHTML(activity.title)}</strong>
            <p class="muted">
              ${escapeHTML(dept?.name || "Departamento")}
              · ${escapeHTML(activity.activity_date)}
              ${activity.activity_time
                ? " · " + escapeHTML(activity.activity_time)
                : ""}
            </p>
            <p>${escapeHTML(activity.description)}</p>
            <p><strong>Estado:</strong> ${escapeHTML(activity.status)}</p>
            <p><strong>Plazo cumplido:</strong> ${deadline}</p>
            <p><strong>Observaciones:</strong>
              ${escapeHTML(activity.observations || "Ninguna")}
            </p>
          </article>
        `;
      }).join("");
    }

    $("loginForm").addEventListener("submit", async event => {
      event.preventDefault();
      $("loginBtn").disabled = true;
      showMessage("Verificando acceso...");

      try {
        const { error } = await db.auth.signInWithPassword({
          email: $("email").value.trim(),
          password: $("password").value
        });

        if (error) {
          showMessage(
            "No se pudo iniciar sesión. Comprueba tus credenciales."
          );
          return;
        }

        await loadDashboard();
      } catch (error) {
        showMessage("No se pudo conectar con Supabase.");
      } finally {
        $("loginBtn").disabled = false;
      }
    });

    $("activityForm").addEventListener("submit", async event => {
      event.preventDefault();

      if (!currentUser || !profile) {
        showFormMessage("Inicia sesión nuevamente.");
        return;
      }

      const departmentId = Number($("department").value);

      if (
        profile.role !== "admin" &&
        departmentId !== Number(profile.department_id)
      ) {
        showFormMessage("No puedes registrar actividades en otro departamento.");
        return;
      }

      $("saveBtn").disabled = true;
      showFormMessage("Guardando actividad...");

      try {
        const now = new Date().toISOString();
        const deadlineValue = $("deadline").value;

        const activity = {
          id: crypto.randomUUID(),
          user_id: currentUser.id,
          department_id: departmentId,
          title: $("title").value.trim(),
          activity_date: $("activityDate").value,
          activity_time: $("activityTime").value || null,
          description: $("description").value.trim(),
          deadline_met: deadlineValue === ""
            ? null
            : deadlineValue === "true",
          observations: $("observations").value.trim(),
          status: $("status").value,
          created_at: now,
          updated_at: now
        };

        const { error } = await db
          .from("activities")
          .insert(activity);

        if (error) {
          showFormMessage(
            "No se pudo guardar la actividad. Revisa los campos y permisos."
          );
          console.error("Error de registro:", error);
          return;
        }

        showFormMessage("Actividad guardada correctamente.");
        $("title").value = "";
        $("description").value = "";
        $("activityTime").value = "";
        $("deadline").value = "";
        $("status").value = "En proceso";
        $("observations").value = "";

        await loadActivities();
      } catch (error) {
        showFormMessage("Ocurrió un error al guardar la actividad.");
        console.error(error);
      } finally {
        $("saveBtn").disabled = false;
      }
    });

    $("refreshBtn").addEventListener("click", loadActivities);

    $("logoutBtn").addEventListener("click", async () => {
      const { error } = await db.auth.signOut();

      if (error) {
        showMessage("No se pudo cerrar la sesión.");
        return;
      }

      showLoggedOut();
      showMessage("Sesión cerrada.");
    });

    loadDashboard().catch(error => {
      console.error(error);
      showMessage("Ocurrió un error al iniciar la aplicación.");
    });
  </script>
</body>
</html>
